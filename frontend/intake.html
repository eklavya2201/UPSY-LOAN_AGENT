<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UPSY — Smart Intake (prototype)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        primary: "#2563eb", "primary-dark": "#1d4ed8", "primary-soft": "#eef3fb",
        "primary-line": "#dbe1ff", secondary: "#595f66", outline: "#737686",
        "outline-variant": "#c3c6d7", surface: "#f8f9ff", "surface-container": "#eff4ff",
        "surface-high": "#dce9ff", "on-surface": "#0b1c30", "on-surface-variant": "#434655",
        success: "#16a34a", "success-soft": "#ecfdf3", amber: "#b45309",
        "amber-soft": "#fffbeb", danger: "#dc2626", "danger-soft": "#fef2f2",
      },
      fontFamily: { sans: ["Inter", "sans-serif"] },
      borderRadius: { "2xl": "14px" },
    } },
  };
</script>
<style>
  body { font-family: "Inter", sans-serif; background: #f8f9ff; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; line-height: 1; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; vertical-align: middle; }
  .card-shadow { box-shadow: 0 4px 20px rgba(37, 99, 235, 0.05); }
  .fade-in { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="text-on-surface min-h-screen">
<main class="max-w-2xl mx-auto px-6 py-12">

  <div class="flex items-center gap-2 mb-2">
    <span class="text-xs font-bold text-primary bg-primary-soft border border-primary-line px-2.5 py-1 rounded-full">PROTOTYPE</span>
    <span class="text-xs text-on-surface-variant">Smart intake — one sentence → structured application</span>
  </div>
  <h1 class="text-3xl font-extrabold mb-2">Tell us what you need</h1>
  <p class="text-on-surface-variant mb-6">Describe your loan in plain words. We'll turn it into a structured application and ask only for what's missing.</p>

  <textarea id="text" rows="3" placeholder="e.g. I need around 8 lakh for an MS in Computer Science in the US, starting this August. My dad will be co-applicant."
    class="w-full p-4 bg-white border border-outline-variant rounded-2xl text-base focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition resize-none"></textarea>

  <div class="flex flex-wrap gap-2 mt-3" id="examples">
    <button class="ex text-xs text-on-surface-variant bg-white border border-outline-variant hover:border-primary rounded-full px-3 py-1.5 transition">MS in US, ~8 lakh, dad co-applicant</button>
    <button class="ex text-xs text-on-surface-variant bg-white border border-outline-variant hover:border-primary rounded-full px-3 py-1.5 transition">MBA abroad, need about 25 lakhs, have property to pledge</button>
    <button class="ex text-xs text-on-surface-variant bg-white border border-outline-variant hover:border-primary rounded-full px-3 py-1.5 transition">B.Tech in India, 5 lakh, mom is co-borrower</button>
  </div>

  <button id="go" class="mt-5 h-13 px-8 py-3 bg-primary text-white font-semibold rounded-full hover:bg-primary-dark active:scale-[0.98] transition inline-flex items-center gap-2 disabled:opacity-50">
    <span class="material-symbols-outlined">auto_awesome</span> Structure my request
  </button>

  <div id="result" class="mt-8"></div>

</main>
<script src="intake.js"></script>
</body>
</html>
