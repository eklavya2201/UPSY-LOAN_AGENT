<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UPSY Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        primary: "#2563eb", "primary-dark": "#1d4ed8", "primary-soft": "#eef3fb",
        "primary-line": "#dbe1ff", secondary: "#595f66", outline: "#737686",
        "outline-variant": "#c3c6d7", surface: "#f8f9ff", "surface-container": "#eff4ff",
        "on-surface": "#0b1c30", "on-surface-variant": "#434655",
        success: "#16a34a", "success-soft": "#ecfdf3", amber: "#b45309",
        "amber-soft": "#fffbeb", danger: "#dc2626", "danger-soft": "#fef2f2",
      },
      fontFamily: { sans: ["Inter", "sans-serif"] },
      borderRadius: { xl: "0.75rem", "2xl": "14px" },
      maxWidth: { container: "1120px" },
    } },
  };
</script>
<style>
  body {
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(160deg, #eef4ff 0%, #f8f9ff 45%, #ffffff 100%);
    background-attachment: fixed;
  }
  .material-symbols-outlined { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; vertical-align: middle; }
  .card-shadow { box-shadow: 0 4px 20px rgba(37, 99, 235, 0.05); }
  .fade-in { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="text-on-surface min-h-screen">
  <div id="app"></div>
  <!-- Absolute path: the SPA is also served at subpaths like /docs/3, where a
       relative "app.js" would wrongly resolve to /docs/app.js (a blank page). -->
  <script src="/app.js"></script>
</body>
</html>
