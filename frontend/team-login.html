<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Not indexable: this page names the company and the fact that a dashboard
     sits behind it, which is free reconnaissance for anyone scanning. -->
<meta name="robots" content="noindex, nofollow">
<title>Sign in · UPSY Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Palette lifted from team.html so this does not read as a bolted-on page:
     same brand blue, same Inter, same soft-blue ground. */
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-soft: #eef3fb;
    --ground: #f8f9ff;
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --line: #dbe1ff;
    --danger: #b42318;
    --danger-soft: #fef2f2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--ground);
    color: var(--ink);
    font: 400 16px/1.55 Inter, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2.25rem 2rem;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 32px rgba(37, 99, 235, .07);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 1.75rem;
  }
  .brand .mark {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--primary);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: .95rem;
    letter-spacing: -.02em;
  }
  .brand b { font-weight: 700; letter-spacing: -.015em; }

  h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 .35rem; }
  .sub { margin: 0 0 1.6rem; color: var(--ink-soft); font-size: .92rem; }

  form { display: flex; flex-direction: column; gap: 1rem; }
  label { display: flex; flex-direction: column; gap: .4rem; font-size: .85rem; font-weight: 600; }

  input {
    font: 400 1rem/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
    padding: .7rem .8rem;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
    border-color: var(--primary);
  }

  button {
    margin-top: .3rem;
    font: 600 .97rem/1 Inter, ui-sans-serif, system-ui, sans-serif;
    padding: .8rem 1rem;
    border: 0;
    border-radius: 9px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--primary-dark); outline-offset: 2px; }

  .msg {
    margin: 0;
    padding: .7rem .8rem;
    border-radius: 9px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: .88rem;
    font-weight: 500;
  }
  [hidden] { display: none !important; }

  .foot {
    margin: 1.6rem 0 0;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
    font-size: .82rem;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark" aria-hidden="true">U</span>
      <b>UPSY Admin</b>
    </div>

    <h1>Sign in</h1>
    <p class="sub">This dashboard holds applicants' documents and contact details.</p>

    <p class="msg" id="error" role="alert" hidden></p>

    <form id="form" novalidate>
      <label>
        Email
        <input id="email" type="email" name="email" autocomplete="username"
               required autofocus placeholder="you@upsy.in">
      </label>
      <label>
        Password
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button id="submit" type="submit">Sign in</button>
    </form>

    <p class="foot">Sessions last 12 hours. Close the browser to end one sooner.</p>
  </main>

<script>
(function () {
  var form = document.getElementById("form");
  var errorBox = document.getElementById("error");
  var submit = document.getElementById("submit");

  // Where to land after signing in. Guarded to a same-site path so a crafted
  // ?next= cannot bounce a signed-in officer to another origin.
  function nextPath() {
    var raw = new URLSearchParams(location.search).get("next") || "/team";
    return /^\/[a-zA-Z0-9/_\-?=&.]*$/.test(raw) && !raw.startsWith("//") ? raw : "/team";
  }

  function fail(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
    submit.disabled = false;
    submit.textContent = "Sign in";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorBox.hidden = true;
    submit.disabled = true;
    submit.textContent = "Signing in…";

    try {
      var res = await fetch("/api/team/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) return fail(data.error || "Could not sign in.");
      location.replace(nextPath());
    } catch (err) {
      fail("Could not reach the server. Check your connection and try again.");
    }
  });
})();
</script>
</body>
</html>
