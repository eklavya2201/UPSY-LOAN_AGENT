<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UPSY Admin — Applications</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        primary: "#2563eb", "primary-dark": "#1d4ed8", "primary-soft": "#eef3fb",
        "primary-line": "#dbe1ff", secondary: "#595f66", outline: "#737686",
        "outline-variant": "#c3c6d7", surface: "#f8f9ff", "surface-container": "#eff4ff",
        "surface-high": "#dce9ff", "on-surface": "#0b1c30", "on-surface-variant": "#434655",
        success: "#16a34a", "success-soft": "#ecfdf3", amber: "#b45309",
        "amber-soft": "#fffbeb", danger: "#dc2626", "danger-soft": "#fef2f2",
      },
      fontFamily: { sans: ["Inter", "sans-serif"] },
      borderRadius: { "2xl": "14px" },
    } },
  };
</script>
<style>
  body {
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(160deg, #eef4ff 0%, #f8f9ff 45%, #ffffff 100%);
    background-attachment: fixed;
  }
  .material-symbols-outlined { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; vertical-align: middle; }
  .card-shadow { box-shadow: 0 4px 20px rgba(37, 99, 235, 0.05); transition: box-shadow .25s ease, transform .25s ease; }
  .custom-scrollbar::-webkit-scrollbar { width: 5px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .fade-in { animation: fade .35s cubic-bezier(.16,1,.3,1); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Site-wide interaction polish: every button/link gets a consistent,
     gentle transition instead of snapping between states. */
  button, a, input, select, textarea, .card-shadow { transition: all .18s ease; }
  button:not(:disabled):active { transform: scale(.97); }
  button:disabled { cursor: not-allowed; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

  /* Applicant list rows lift slightly on hover so the clickable list reads
     as interactive, not just a static feed. */
  .app-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(37, 99, 235, 0.14); }

  /* ── Live-assist call status ──────────────────────────────────────────
     Motion here is doing real work: an applicant looking at an empty
     meeting needs to see that something is still happening. */
  .ua-phase { animation: uaPhaseIn .3s cubic-bezier(.16,1,.3,1); }
  @keyframes uaPhaseIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } to { opacity: 1; transform: none; } }

  .ua-dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; flex: none; }
  .ua-dot-pulse { animation: uaPulse 1.4s ease-in-out infinite; }
  @keyframes uaPulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

  /* Equaliser bars while the agent is actually talking. */
  .ua-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; flex: none; }
  .ua-bars i { width: 3px; height: 100%; border-radius: 2px; background: currentColor; transform-origin: bottom; animation: uaBar .9s ease-in-out infinite; }
  .ua-bars i:nth-child(2) { animation-delay: .15s; }
  .ua-bars i:nth-child(3) { animation-delay: .3s; }
  @keyframes uaBar { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

  .ua-step-active { animation: uaStepIn .35s ease; }
  @keyframes uaStepIn { from { opacity: .5; transform: translateX(-3px); } to { opacity: 1; transform: none; } }

  /* Toast that appears the moment a call is started, so pasting a link has
     an immediate, visible consequence. */
  .ua-toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 60; max-width: 340px;
    animation: uaToastIn .45s cubic-bezier(.16,1,.3,1);
  }
  .ua-toast.ua-toast-out { animation: uaToastOut .3s ease forwards; }
  @keyframes uaToastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes uaToastOut { to { opacity: 0; transform: translateY(10px) scale(.98); } }

  /* Concentric rings behind the avatar while the bot is en route. */
  .ua-ripple { position: relative; }
  .ua-ripple::before, .ua-ripple::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border: 2px solid currentColor; opacity: 0; animation: uaRipple 1.8s ease-out infinite;
  }
  .ua-ripple::after { animation-delay: .9s; }
  @keyframes uaRipple { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.6); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .ua-dot-pulse, .ua-bars i, .ua-ripple::before, .ua-ripple::after { animation: none; }
    .ua-phase, .ua-toast, .ua-step-active { animation-duration: .01ms; }
  }
</style>
</head>
<body class="text-on-surface min-h-screen">

<!-- Side navigation -->
<aside class="h-screen w-64 fixed left-0 top-0 bg-surface-container border-r border-outline-variant/60 flex-col p-4 gap-2 z-40 hidden md:flex">
  <div class="text-xl font-black text-primary mb-8 px-2 tracking-tight">UPSY Admin</div>
  <div class="flex items-center gap-3 px-3 py-3 mb-4 bg-white/60 rounded-xl">
    <div class="w-10 h-10 rounded-full bg-primary text-white grid place-items-center font-bold">U</div>
    <div>
      <p class="text-sm font-bold">UPSY Team</p>
      <p class="text-xs text-on-surface-variant">Loan operations</p>
    </div>
  </div>
  <nav class="flex-1 space-y-1">
    <a class="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-lg font-bold" href="#">
      <span class="material-symbols-outlined">description</span>
      <span class="text-sm">Applications</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-white/70 rounded-lg transition" href="/" target="_blank">
      <span class="material-symbols-outlined">open_in_new</span>
      <span class="text-sm">Applicant view</span>
    </a>
  </nav>
  <div class="text-[11px] text-on-surface-variant px-2" id="sidebarFoot"></div>
</aside>

<!-- Main canvas -->
<main class="md:ml-64 min-h-screen p-6 md:p-10">
  <div class="max-w-[1200px] mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold" id="pageTitle">Applications</h1>
      <p class="text-on-surface-variant mt-1" id="pageSub">Live borrower files from the UPSY assistant.</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Applicant list -->
      <aside class="lg:col-span-4">
        <!-- Two different populations, deliberately not merged into one list.
             A borrower file is someone working through documents; a voice caller
             is someone who has only ever talked to UPSY on the phone. They can
             be the same human, but we do not assume that from a matching phone
             number — guessing wrong merges two applicants. -->
        <div class="flex gap-1 p-1 mb-4 bg-surface-container rounded-xl border border-outline-variant/50">
          <button id="modeLeads" data-mode="leads" class="list-mode flex-1 h-9 rounded-lg text-xs font-bold transition bg-white text-primary card-shadow">Borrower files</button>
          <button id="modeVoice" data-mode="voice" class="list-mode flex-1 h-9 rounded-lg text-xs font-bold transition text-on-surface-variant hover:text-primary">Voice callers</button>
          <!-- Third population, and the only one that is not a person we can
               open a file on: most reviews are anonymous by design. -->
          <button id="modeReviews" data-mode="reviews" class="list-mode flex-1 h-9 rounded-lg text-xs font-bold transition text-on-surface-variant hover:text-primary">Feedback</button>
        </div>
        <div class="relative mb-4">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
          <input id="search" class="w-full h-12 pl-10 pr-4 bg-white rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition text-sm" placeholder="Search applicants…" type="text"/>
        </div>
        <div id="appList" class="space-y-3 max-h-[calc(100vh-16rem)] overflow-y-auto custom-scrollbar pr-1"></div>
      </aside>

      <!-- Borrower file -->
      <section id="detail" class="lg:col-span-8">
        <div class="h-64 grid place-items-center text-on-surface-variant bg-white/50 border border-dashed border-outline-variant rounded-2xl">
          Select an application to open its borrower file.
        </div>
      </section>
    </div>
  </div>
</main>

<script src="/liveAssistPhases.js"></script>
<script src="team.js"></script>
</body>
</html>
