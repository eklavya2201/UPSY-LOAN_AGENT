services:
  - type: web
    name: upsy-loan-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NOTIFY_CHANNEL
        value: mock
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_VISION_MODEL
        value: openai/gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: AGENTCALL_API_KEY
        sync: false
      # Browser voice calls on /upsy-voice-agent. Without these the page still
      # loads and the Call button reports exactly what is missing — it does not
      # break the app.
      #
      # "upsy" is our own relay: Deepgram → Claude → Deepgram Aura, with
      # turn-taking in backend/voiceRelay.js. Unlike the hosted path, the audio
      # passes through this service — so a paid instance type is worth revisiting
      # if calls ever get real traffic (free instances sleep and have no
      # persistent disk, which the data/ caveat elsewhere already notes).
      - key: VOICE_PROVIDER
        value: upsy
      # Does both the hearing (STT) and the speaking (Aura TTS) now — Cartesia's
      # free tier bills per character and ran dry at ~21 calls a month.
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      # Hindi, Marathi, Telugu, Tamil, Kannada, Malayalam, Bengali, Gujarati,
      # Punjabi, Odia. NOT interchangeable with the Deepgram key: Aura has no
      # Indian-language voice at all, so without this a non-English call cannot
      # be spoken and POST /api/voice/session refuses it with a named error.
      # Deepgram still carries English. See `npm run voice:sarvam`.
      - key: SARVAM_API_KEY
        sync: false
      # Only used when VOICE_PROVIDER=cartesia (the hosted agent path).
      - key: CARTESIA_AGENT_ID
        sync: false
      # Where /upsy-voice-agent's "Schedule call" requests are texted. Unset is
      # fine — they still persist and print to the server log.
      - key: OPS_PHONE
        sync: false
      # The false-info check (backend/instituteVerify.js) searches the web for
      # the course a caller names. With this set it uses Serper; without it,
      # DuckDuckGo's keyless endpoint — which has already answered with a
      # bot-check (HTTP 202) from a dev machine. Treat Serper as the real path.
      - key: SERPER_API_KEY
        sync: false
