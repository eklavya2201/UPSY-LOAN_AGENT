services:
  - type: web
    name: upsy-loan-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NOTIFY_CHANNEL
        value: mock
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_VISION_MODEL
        value: openai/gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: AGENTCALL_API_KEY
        sync: false
      # Browser voice calls on /m. Without these the page still loads and the
      # Call button reports exactly what is missing — it does not break the app.
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_AGENT_ID
        sync: false
      # Where /m's "Schedule call" requests are texted. Unset is fine — they
      # still persist and print to the server log.
      - key: OPS_PHONE
        sync: false
